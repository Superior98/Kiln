<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiln</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/": "https://esm.sh/react@18.3.1/",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "three": "https://esm.sh/three@0.184.0",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1"
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.5/babel.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      html, body, #root {
        width: 100%;
        min-width: 320px;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #0b090d;
      }
      #root {
        display: flex;
        box-sizing: border-box;
      }
      button, input, textarea {
        font: inherit;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <main id="root" aria-label="Kiln workspace"></main>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      const source = await fetch('./Ui.jsx').then(response => {
        if (!response.ok) throw new Error(`Unable to load Ui.jsx (${response.status})`);
        return response.text();
      });
      const compiled = Babel.transform(source, { presets: ['react'] }).code;
      const moduleUrl = URL.createObjectURL(new Blob([compiled], { type: 'text/javascript' }));

      try {
        const { default: KilnApp } = await import(moduleUrl);
        createRoot(document.getElementById('root')).render(React.createElement(KilnApp));
      } finally {
        URL.revokeObjectURL(moduleUrl);
      }
    </script>
  </body>
</html>
